services:

  app:
    build: .
    container_name: enterprise-ai-chatbot
    command: uvicorn main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    depends_on:
      - neo4j
      - postgres

    environment:
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000

      # Authentication settings are required at runtime to issue and validate
      # JWTs; Compose's .env file is not injected automatically.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}

      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

      CHROMA_DB_PATH: /app/chroma_db

    volumes:
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db

  neo4j:

    image: neo4j:5

    container_name: neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}

    volumes:
      - neo4j_data:/data

  postgres:

    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:

    image: nginx:latest

    container_name: nginx

    depends_on:
      - app

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:

  neo4j_data:

  postgres_data:

  
