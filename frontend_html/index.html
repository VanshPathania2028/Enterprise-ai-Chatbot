<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Interactive Enterprise AI Chatbot interface"
    >

    <title>Enterprise AI Chatbot</title>

    <style>
        :root {
            --primary: #5b5cf0;
            --primary-dark: #4647d9;
            --primary-soft: rgba(91, 92, 240, 0.12);

            --background: #f6f7fb;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-solid: #ffffff;
            --surface-secondary: #eef0f7;

            --text-primary: #181b2a;
            --text-secondary: #6d7285;
            --border: rgba(24, 27, 42, 0.1);

            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;

            --sidebar-bg: #171927;
            --sidebar-surface: #222536;
            --sidebar-text: #f8fafc;
            --sidebar-muted: #9ca3af;

            --shadow-small:
                0 4px 18px rgba(22, 25, 40, 0.06);

            --shadow-large:
                0 18px 60px rgba(22, 25, 40, 0.13);

            --radius-small: 10px;
            --radius-medium: 16px;
            --radius-large: 24px;

            --transition-fast: 160ms ease;
            --transition-normal: 260ms ease;
        }

        body.dark {
            --background: #0f1119;
            --surface: rgba(24, 27, 40, 0.92);
            --surface-solid: #181b28;
            --surface-secondary: #202331;

            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);

            --sidebar-bg: #090b11;
            --sidebar-surface: #141722;

            --shadow-small:
                0 4px 18px rgba(0, 0, 0, 0.25);

            --shadow-large:
                0 18px 60px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(91, 92, 240, 0.08),
                    transparent 38%
                ),
                var(--background);

            color: var(--text-primary);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            transition:
                background var(--transition-normal),
                color var(--transition-normal);
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            border: none;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* ==========================
           Sidebar
        ========================== */

        .sidebar {
            width: 290px;
            min-width: 290px;
            height: 100vh;

            display: flex;
            flex-direction: column;

            padding: 22px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.02),
                    transparent
                ),
                var(--sidebar-bg);

            color: var(--sidebar-text);

            box-shadow:
                14px 0 50px rgba(0, 0, 0, 0.08);

            z-index: 30;

            transition:
                transform var(--transition-normal),
                width var(--transition-normal);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #7c7df6,
                    #4647d9
                );

            box-shadow:
                0 10px 30px rgba(91, 92, 240, 0.3);

            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-text h1 {
            font-size: 17px;
            line-height: 1.2;
        }

        .brand-text p {
            margin-top: 3px;

            color: var(--sidebar-muted);

            font-size: 12px;
        }

        .new-chat-button {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 13px 16px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #7a61f5
                );

            color: white;

            cursor: pointer;

            box-shadow:
                0 10px 28px rgba(91, 92, 240, 0.28);

            transition:
                transform var(--transition-fast),
                box-shadow var(--transition-fast);
        }

        .new-chat-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 34px rgba(91, 92, 240, 0.34);
        }

        .new-chat-button:active {
            transform: translateY(0);
        }

        .sidebar-section {
            margin-top: 26px;
        }

        .section-title {
            margin-bottom: 10px;

            color: var(--sidebar-muted);

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .conversation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;

            max-height: 260px;

            overflow-y: auto;
            padding-right: 3px;
        }

        .conversation-item {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 11px 12px;

            border-radius: 12px;

            background: transparent;
            color: #d8dbe8;

            text-align: left;
            cursor: pointer;

            transition:
                background var(--transition-fast),
                color var(--transition-fast);
        }

        .conversation-item:hover {
            background: var(--sidebar-surface);
            color: white;
        }

        .conversation-item span {
            overflow: hidden;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .token-panel {
            padding: 14px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 14px;

            background: var(--sidebar-surface);
        }

        .token-input {
            width: 100%;

            padding: 10px 11px;

            border:
                1px solid rgba(255, 255, 255, 0.1);

            border-radius: 10px;

            outline: none;

            background: rgba(255, 255, 255, 0.04);
            color: white;

            font-size: 12px;

            transition:
                border var(--transition-fast),
                box-shadow var(--transition-fast);
        }

        .token-input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(91, 92, 240, 0.14);
        }

        .token-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 8px;
        }

        .sidebar-small-button {
            padding: 9px 10px;

            border-radius: 9px;

            background: rgba(255, 255, 255, 0.07);
            color: white;

            cursor: pointer;

            transition: background var(--transition-fast);
        }

        .sidebar-small-button:hover {
            background: rgba(255, 255, 255, 0.13);
        }

        .sidebar-footer {
            margin-top: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-top: 18px;

            border-top:
                1px solid rgba(255, 255, 255, 0.08);

            color: var(--sidebar-muted);

            font-size: 12px;
        }

        .api-state {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .state-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--warning);

            box-shadow:
                0 0 0 4px rgba(245, 158, 11, 0.12);
        }

        .state-dot.online {
            background: var(--success);

            box-shadow:
                0 0 0 4px rgba(34, 197, 94, 0.12);
        }

        .state-dot.offline {
            background: var(--danger);

            box-shadow:
                0 0 0 4px rgba(239, 68, 68, 0.12);
        }

        /* ==========================
           Main Area
        ========================== */

        .main-area {
            position: relative;

            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 72px;
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            border-bottom:
                1px solid var(--border);

            background: var(--surface);
            backdrop-filter: blur(18px);

            z-index: 15;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-menu-button {
            display: none;

            width: 40px;
            height: 40px;

            border-radius: 11px;

            background: var(--surface-secondary);
            color: var(--text-primary);

            cursor: pointer;
        }

        .topbar-title h2 {
            font-size: 17px;
        }

        .topbar-title p {
            margin-top: 2px;

            color: var(--text-secondary);

            font-size: 12px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .icon-button {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: var(--surface-solid);
            color: var(--text-primary);

            cursor: pointer;

            box-shadow: var(--shadow-small);

            transition:
                transform var(--transition-fast),
                background var(--transition-fast);
        }

        .icon-button:hover {
            transform: translateY(-1px);
            background: var(--surface-secondary);
        }

        /* ==========================
           Chat body
        ========================== */

        .chat-scroll-area {
            flex: 1;

            overflow-y: auto;

            padding: 34px 22px 20px;

            scroll-behavior: smooth;
        }

        .chat-content {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .welcome-panel {
            margin: 7vh auto 0;

            max-width: 760px;

            text-align: center;

            animation:
                fadeUp 600ms ease both;
        }

        .welcome-avatar {
            width: 74px;
            height: 74px;

            display: grid;
            place-items: center;

            margin: 0 auto 20px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #9a66f6
                );

            color: white;

            font-size: 23px;
            font-weight: 800;

            box-shadow:
                0 18px 48px rgba(91, 92, 240, 0.3);
        }

        .welcome-panel h1 {
            font-size:
                clamp(28px, 4vw, 42px);

            line-height: 1.12;
            letter-spacing: -0.035em;
        }

        .welcome-panel p {
            max-width: 610px;

            margin: 16px auto 0;

            color: var(--text-secondary);

            font-size: 15px;
            line-height: 1.75;
        }

        .suggestion-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            margin-top: 30px;
        }

        .suggestion-card {
            position: relative;

            min-height: 112px;

            padding: 18px;

            overflow: hidden;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background: var(--surface);
            color: var(--text-primary);

            text-align: left;

            cursor: pointer;

            box-shadow: var(--shadow-small);

            transition:
                transform var(--transition-normal),
                box-shadow var(--transition-normal),
                border var(--transition-normal);
        }

        .suggestion-card::after {
            position: absolute;
            right: -24px;
            bottom: -30px;

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: var(--primary-soft);

            content: "";
        }

        .suggestion-card:hover {
            transform: translateY(-4px);

            border-color:
                rgba(91, 92, 240, 0.35);

            box-shadow: var(--shadow-large);
        }

        .suggestion-icon {
            margin-bottom: 13px;

            color: var(--primary);

            font-size: 20px;
        }

        .suggestion-card strong {
            display: block;

            font-size: 14px;
        }

        .suggestion-card small {
            display: block;

            margin-top: 6px;

            color: var(--text-secondary);

            line-height: 1.5;
        }

        /* ==========================
           Messages
        ========================== */

        .message-group {
            display: flex;
            gap: 12px;

            margin-bottom: 24px;

            animation:
                messageEnter 320ms ease both;
        }

        .message-group.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background: var(--surface-solid);
            color: var(--text-primary);

            box-shadow: var(--shadow-small);

            font-size: 12px;
            font-weight: 800;
        }

        .message-group.bot .message-avatar {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #7c61ef
                );

            color: white;
        }

        .message-wrapper {
            max-width: min(76%, 720px);
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 6px;

            color: var(--text-secondary);

            font-size: 11px;
        }

        .message-group.user .message-meta {
            justify-content: flex-end;
        }

        .message-bubble {
            padding: 14px 16px;

            border:
                1px solid var(--border);

            border-radius:
                6px 18px 18px 18px;

            background: var(--surface-solid);
            color: var(--text-primary);

            box-shadow: var(--shadow-small);

            line-height: 1.7;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-group.user .message-bubble {
            border: none;

            border-radius:
                18px 6px 18px 18px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #6f5be7
                );

            color: white;
        }

        .message-group.error .message-bubble {
            border-color:
                rgba(239, 68, 68, 0.24);

            background:
                rgba(239, 68, 68, 0.08);

            color: var(--danger);
        }

        .message-actions {
            display: flex;
            gap: 6px;

            margin-top: 7px;

            opacity: 0;

            transform: translateY(-3px);

            transition:
                opacity var(--transition-fast),
                transform var(--transition-fast);
        }

        .message-group:hover .message-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .message-group.user .message-actions {
            justify-content: flex-end;
        }

        .message-action-button {
            padding: 6px 8px;

            border-radius: 8px;

            background: transparent;
            color: var(--text-secondary);

            cursor: pointer;

            font-size: 11px;

            transition:
                background var(--transition-fast),
                color var(--transition-fast);
        }

        .message-action-button:hover {
            background: var(--surface-secondary);
            color: var(--text-primary);
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            min-width: 72px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--text-secondary);

            animation:
                typingPulse 1.25s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 160ms;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 320ms;
        }

        /* ==========================
           Composer
        ========================== */

        .composer-section {
            padding:
                12px 22px 18px;

            border-top:
                1px solid var(--border);

            background:
                linear-gradient(
                    to top,
                    var(--background) 60%,
                    transparent
                );
        }

        .composer-wrap {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;

            padding: 10px;

            border:
                1px solid var(--border);

            border-radius: 20px;

            background: var(--surface-solid);

            box-shadow: var(--shadow-large);

            transition:
                border var(--transition-fast),
                box-shadow var(--transition-fast);
        }

        .composer:focus-within {
            border-color:
                rgba(91, 92, 240, 0.5);

            box-shadow:
                0 18px 55px rgba(91, 92, 240, 0.14);
        }

        .composer-textarea {
            flex: 1;

            min-height: 46px;
            max-height: 180px;

            padding: 11px 8px 8px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;
            color: var(--text-primary);

            line-height: 1.5;
        }

        .composer-textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-button,
        .stop-button {
            width: 46px;
            height: 46px;
            min-width: 46px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            color: white;

            cursor: pointer;

            transition:
                transform var(--transition-fast),
                opacity var(--transition-fast);
        }

        .send-button {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #7c61ef
                );

            box-shadow:
                0 10px 24px rgba(91, 92, 240, 0.24);
        }

        .stop-button {
            display: none;
            background: var(--danger);
        }

        .send-button:hover,
        .stop-button:hover {
            transform: translateY(-2px);
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .composer-note {
            margin-top: 9px;

            color: var(--text-secondary);

            text-align: center;

            font-size: 11px;
        }

        /* ==========================
           Toast
        ========================== */

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;

            max-width: 320px;

            padding: 12px 15px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: var(--surface-solid);
            color: var(--text-primary);

            box-shadow: var(--shadow-large);

            opacity: 0;
            pointer-events: none;

            transform: translateY(-10px);

            z-index: 100;

            transition:
                opacity var(--transition-normal),
                transform var(--transition-normal);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;

            display: none;

            background: rgba(0, 0, 0, 0.42);

            opacity: 0;

            z-index: 25;

            transition: opacity var(--transition-normal);
        }

        .sidebar-overlay.show {
            opacity: 1;
        }

        /* ==========================
           Animations
        ========================== */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes messageEnter {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes typingPulse {
            0%,
            70%,
            100% {
                transform: translateY(0);
                opacity: 0.35;
            }

            35% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ==========================
           Responsive
        ========================== */

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;

                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: block;
            }

            .mobile-menu-button {
                display: grid;
                place-items: center;
            }

            .chat-scroll-area {
                padding-left: 16px;
                padding-right: 16px;
            }

            .composer-section {
                padding-left: 14px;
                padding-right: 14px;
            }
        }

        @media (max-width: 650px) {
            .topbar {
                height: 64px;
                min-height: 64px;
                padding: 0 14px;
            }

            .topbar-title p {
                display: none;
            }

            .topbar-actions .icon-button:first-child {
                display: none;
            }

            .chat-scroll-area {
                padding-top: 22px;
            }

            .welcome-panel {
                margin-top: 3vh;
            }

            .welcome-avatar {
                width: 62px;
                height: 62px;
                border-radius: 18px;
            }

            .suggestion-grid {
                grid-template-columns: 1fr;
            }

            .suggestion-card {
                min-height: 94px;
            }

            .message-wrapper {
                max-width: 86%;
            }

            .message-avatar {
                width: 34px;
                height: 34px;
                min-width: 34px;
            }

            .message-bubble {
                padding: 12px 14px;
                font-size: 14px;
            }

            .composer-section {
                padding-bottom:
                    max(12px, env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 430px) {
            .sidebar {
                width: min(88vw, 310px);
                min-width: unset;
            }

            .topbar-title h2 {
                font-size: 15px;
            }

            .message-group {
                gap: 8px;
            }

            .message-wrapper {
                max-width: 89%;
            }

            .composer {
                border-radius: 17px;
            }

            .send-button,
            .stop-button {
                width: 42px;
                height: 42px;
                min-width: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="app-shell">

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="brand-row">

            <div class="brand-icon">
                AI
            </div>

            <div class="brand-text">
                <h1>Enterprise AI</h1>
                <p>Intelligent knowledge assistant</p>
            </div>

        </div>

        <button
            class="new-chat-button"
            type="button"
            onclick="startNewChat()"
        >
            <span>＋</span>
            <span>New conversation</span>
        </button>

        <div class="sidebar-section">

            <div class="section-title">
                Recent conversations
            </div>

            <div
                id="conversationList"
                class="conversation-list"
            ></div>

        </div>

        <div class="sidebar-section">

            <div class="section-title">
                Authentication
            </div>

            <div class="token-panel">

                <input
                    id="tokenInput"
                    class="token-input"
                    type="password"
                    autocomplete="off"
                    placeholder="Paste JWT access token"
                >

                <div class="token-actions">

                    <button
                        class="sidebar-small-button"
                        type="button"
                        onclick="saveToken()"
                    >
                        Save token
                    </button>

                    <button
                        class="sidebar-small-button"
                        type="button"
                        onclick="clearToken()"
                        title="Remove token"
                    >
                        ✕
                    </button>

                </div>

            </div>

        </div>

        <div class="sidebar-footer">

            <div class="api-state">

                <span
                    id="sidebarStateDot"
                    class="state-dot"
                ></span>

                <span id="sidebarStateText">
                    Checking API
                </span>

            </div>

            <span>v1.0</span>

        </div>

    </aside>

    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
        onclick="closeSidebar()"
    ></div>

    <main class="main-area">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="mobile-menu-button"
                    type="button"
                    onclick="toggleSidebar()"
                    aria-label="Open navigation"
                >
                    ☰
                </button>

                <div class="topbar-title">
                    <h2>AI Assistant</h2>
                    <p>RAG, GraphRAG, MCP and Ollama powered</p>
                </div>

            </div>

            <div class="topbar-actions">

                <button
                    class="icon-button"
                    type="button"
                    onclick="checkApiStatus(true)"
                    title="Check API connection"
                >
                    ↻
                </button>

                <button
                    id="themeButton"
                    class="icon-button"
                    type="button"
                    onclick="toggleTheme()"
                    title="Toggle theme"
                >
                    ◐
                </button>

            </div>

        </header>

        <section
            id="chatScrollArea"
            class="chat-scroll-area"
        >

            <div
                id="chatContent"
                class="chat-content"
            ></div>

        </section>

        <footer class="composer-section">

            <div class="composer-wrap">

                <div class="composer">

                    <textarea
                        id="messageInput"
                        class="composer-textarea"
                        rows="1"
                        placeholder="Ask anything about your enterprise knowledge..."
                        aria-label="Chat message"
                    ></textarea>

                    <button
                        id="sendButton"
                        class="send-button"
                        type="button"
                        onclick="sendMessage()"
                        title="Send message"
                    >
                        ➤
                    </button>

                    <button
                        id="stopButton"
                        class="stop-button"
                        type="button"
                        onclick="stopRequest()"
                        title="Stop response"
                    >
                        ■
                    </button>

                </div>

                <div class="composer-note">
                    Press Enter to send · Shift + Enter for a new line
                </div>

            </div>

        </footer>

    </main>

</div>

<div
    id="toast"
    class="toast"
></div>

<script>
    // A UI served by FastAPI/Nginx uses relative paths. When opened through a
    // separate local static server (for example VS Code Live Server), send
    // requests to the Docker API instead of that static server.
    const API_BASE_URL =
        ["", "80", "8000"].includes(window.location.port)
            ? ""
            : "http://127.0.0.1:8000";
    const API_CHAT_URL = `${API_BASE_URL}/chat`;
    const API_HEALTH_URL = `${API_BASE_URL}/health`;

    const chatContent =
        document.getElementById("chatContent");

    const chatScrollArea =
        document.getElementById("chatScrollArea");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const stopButton =
        document.getElementById("stopButton");

    const tokenInput =
        document.getElementById("tokenInput");

    const conversationList =
        document.getElementById("conversationList");

    const sidebar =
        document.getElementById("sidebar");

    const sidebarOverlay =
        document.getElementById("sidebarOverlay");

    const sidebarStateDot =
        document.getElementById("sidebarStateDot");

    const sidebarStateText =
        document.getElementById("sidebarStateText");

    let activeController = null;
    let currentMessages = [];
    let currentConversationId = null;
    let lastUserMessage = "";

    initialiseApplication();

    function initialiseApplication() {
        loadTheme();
        loadToken();
        renderConversationList();
        startNewChat(false);
        bindInputEvents();
        checkApiStatus(false);
    }

    function bindInputEvents() {
        messageInput.addEventListener(
            "keydown",
            function (event) {
                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {
                    event.preventDefault();
                    sendMessage();
                }
            }
        );

        messageInput.addEventListener(
            "input",
            function () {
                resizeTextarea();
                updateSendButton();
            }
        );

        window.addEventListener(
            "resize",
            function () {
                if (window.innerWidth > 900) {
                    closeSidebar();
                }
            }
        );
    }

    function renderWelcome() {
        chatContent.innerHTML = `
            <section class="welcome-panel">

                <div class="welcome-avatar">
                    AI
                </div>

                <h1>
                    What would you like to explore?
                </h1>

                <p>
                    Ask questions from your documents, search enterprise
                    knowledge, compare concepts, run tools or retrieve
                    graph-based information.
                </p>

                <div class="suggestion-grid">

                    ${createSuggestionCard(
                        "✦",
                        "Explain RAG",
                        "How does Retrieval-Augmented Generation improve chatbot accuracy?",
                        "Explain how Retrieval-Augmented Generation improves chatbot accuracy."
                    )}

                    ${createSuggestionCard(
                        "◎",
                        "Compare technologies",
                        "Understand the difference between RAG and GraphRAG.",
                        "What is the difference between RAG and GraphRAG?"
                    )}

                    ${createSuggestionCard(
                        "▦",
                        "Explore knowledge",
                        "Summarise the information available in the enterprise knowledge base.",
                        "Summarise the available enterprise knowledge."
                    )}

                    ${createSuggestionCard(
                        "⌁",
                        "AI fundamentals",
                        "Learn how artificial intelligence systems work.",
                        "Explain Artificial Intelligence in simple terms."
                    )}

                </div>

            </section>
        `;
    }

    function createSuggestionCard(
        icon,
        title,
        description,
        prompt
    ) {
        const safePrompt =
            prompt.replace(/'/g, "\\'");

        return `
            <button
                class="suggestion-card"
                type="button"
                onclick="useSuggestion('${safePrompt}')"
            >

                <div class="suggestion-icon">
                    ${icon}
                </div>

                <strong>
                    ${escapeHtml(title)}
                </strong>

                <small>
                    ${escapeHtml(description)}
                </small>

            </button>
        `;
    }

    function useSuggestion(prompt) {
        messageInput.value = prompt;
        resizeTextarea();
        updateSendButton();
        sendMessage();
    }

    async function sendMessage() {
        const text = messageInput.value.trim();

        if (!text || activeController) {
            return;
        }

        lastUserMessage = text;

        removeWelcome();

        appendMessage(
            "user",
            text
        );

        currentMessages.push({
            role: "user",
            content: text,
            timestamp: new Date().toISOString()
        });

        messageInput.value = "";
        resizeTextarea();
        setLoadingState(true);

        const typingElement =
            appendTypingIndicator();

        activeController =
            new AbortController();

        const headers = {
            "Content-Type": "application/json"
        };

        const token =
            localStorage.getItem("enterprise_chat_token");

        if (token) {
            headers.Authorization =
                `Bearer ${token}`;
        }

        try {
            const response = await fetch(
                API_CHAT_URL,
                {
                    method: "POST",
                    headers: headers,

                    body: JSON.stringify({
                        message: text
                    }),

                    signal: activeController.signal
                }
            );

            let data = {};

            try {
                data = await response.json();
            } catch {
                data = {};
            }

            typingElement.remove();

            if (!response.ok) {
                const errorMessage =
                    getApiErrorMessage(
                        response.status,
                        data
                    );

                appendMessage(
                    "bot",
                    errorMessage,
                    {
                        error: true,
                        retry: true
                    }
                );

                return;
            }

            const answer =
                data.response ??
                data.answer ??
                data.message ??
                "The server returned an empty response.";

            appendMessage(
                "bot",
                answer
            );

            currentMessages.push({
                role: "assistant",
                content: answer,
                timestamp: new Date().toISOString()
            });

            saveCurrentConversation();

        } catch (error) {
            typingElement.remove();

            if (error.name === "AbortError") {
                appendMessage(
                    "bot",
                    "Response generation was stopped."
                );
            } else {
                appendMessage(
                    "bot",
                    "I could not connect to the chatbot API. Make sure FastAPI and Ollama are running.",
                    {
                        error: true,
                        retry: true
                    }
                );
            }

        } finally {
            activeController = null;
            setLoadingState(false);
            messageInput.focus();
        }
    }

    function appendMessage(
        role,
        text,
        options = {}
    ) {
        const group =
            document.createElement("article");

        group.className =
            `message-group ${role}`;

        if (options.error) {
            group.classList.add("error");
        }

        const sender =
            role === "user"
                ? "You"
                : "Enterprise AI";

        const avatar =
            role === "user"
                ? "YOU"
                : "AI";

        const messageId =
            `message-${Date.now()}-${Math.random()}`;

        group.innerHTML = `
            <div class="message-avatar">
                ${avatar}
            </div>

            <div class="message-wrapper">

                <div class="message-meta">

                    <strong>
                        ${sender}
                    </strong>

                    <span>
                        ${formatTime(new Date())}
                    </span>

                </div>

                <div
                    id="${messageId}"
                    class="message-bubble"
                ></div>

                <div class="message-actions">

                    <button
                        class="message-action-button"
                        type="button"
                        onclick="copyMessage('${messageId}')"
                    >
                        Copy
                    </button>

                    ${
                        options.retry
                            ? `
                                <button
                                    class="message-action-button"
                                    type="button"
                                    onclick="retryLastMessage()"
                                >
                                    Retry
                                </button>
                            `
                            : ""
                    }

                </div>

            </div>
        `;

        chatContent.appendChild(group);

        const bubble =
            document.getElementById(messageId);

        bubble.textContent = text;

        scrollToBottom();

        return group;
    }

    function appendTypingIndicator() {
        const group =
            document.createElement("article");

        group.className =
            "message-group bot";

        group.innerHTML = `
            <div class="message-avatar">
                AI
            </div>

            <div class="message-wrapper">

                <div class="message-meta">
                    <strong>Enterprise AI</strong>
                    <span>Thinking...</span>
                </div>

                <div class="message-bubble typing-bubble">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>

            </div>
        `;

        chatContent.appendChild(group);
        scrollToBottom();

        return group;
    }

    function getApiErrorMessage(
        status,
        data
    ) {
        if (status === 401) {
            return (
                "Authentication failed. Add a valid JWT token " +
                "from the sidebar."
            );
        }

        if (status === 403) {
            return (
                "You do not have permission to access this chatbot."
            );
        }

        if (status === 422) {
            return (
                "The request format was rejected by the API. " +
                "The backend expects a JSON field named message."
            );
        }

        if (status === 500) {
            return (
                data.detail ??
                data.error ??
                "The chatbot encountered an internal server error."
            );
        }

        return (
            data.detail ??
            data.error ??
            `The server returned status ${status}.`
        );
    }

    function stopRequest() {
        if (activeController) {
            activeController.abort();
        }
    }

    function retryLastMessage() {
        if (!lastUserMessage || activeController) {
            return;
        }

        messageInput.value =
            lastUserMessage;

        resizeTextarea();
        sendMessage();
    }

    async function copyMessage(messageId) {
        const element =
            document.getElementById(messageId);

        if (!element) {
            return;
        }

        try {
            await navigator.clipboard.writeText(
                element.textContent
            );

            showToast("Message copied.");

        } catch {
            showToast("Unable to copy message.");
        }
    }

    function setLoadingState(isLoading) {
        sendButton.style.display =
            isLoading ? "none" : "grid";

        stopButton.style.display =
            isLoading ? "grid" : "none";

        messageInput.disabled =
            isLoading;

        updateSendButton();
    }

    function updateSendButton() {
        sendButton.disabled =
            !messageInput.value.trim() ||
            Boolean(activeController);
    }

    function resizeTextarea() {
        messageInput.style.height = "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                180
            ) + "px";
    }

    function scrollToBottom() {
        requestAnimationFrame(
            function () {
                chatScrollArea.scrollTo({
                    top: chatScrollArea.scrollHeight,
                    behavior: "smooth"
                });
            }
        );
    }

    function removeWelcome() {
        const welcome =
            document.querySelector(".welcome-panel");

        if (welcome) {
            welcome.remove();
        }
    }

    function startNewChat(
        savePrevious = true
    ) {
        if (
            savePrevious &&
            currentMessages.length > 0
        ) {
            saveCurrentConversation();
        }

        currentConversationId =
            createConversationId();

        currentMessages = [];
        lastUserMessage = "";

        chatContent.innerHTML = "";
        renderWelcome();

        messageInput.value = "";
        resizeTextarea();
        updateSendButton();
        closeSidebar();
        messageInput.focus();
    }

    function saveCurrentConversation() {
        if (currentMessages.length === 0) {
            return;
        }

        const conversations =
            getStoredConversations();

        const firstUserMessage =
            currentMessages.find(
                item => item.role === "user"
            );

        const title =
            firstUserMessage
                ? firstUserMessage.content.slice(0, 45)
                : "New conversation";

        const conversation = {
            id: currentConversationId,
            title: title,
            updatedAt: new Date().toISOString(),
            messages: currentMessages
        };

        const existingIndex =
            conversations.findIndex(
                item =>
                    item.id === currentConversationId
            );

        if (existingIndex >= 0) {
            conversations[existingIndex] =
                conversation;
        } else {
            conversations.unshift(
                conversation
            );
        }

        localStorage.setItem(
            "enterprise_chat_history",
            JSON.stringify(
                conversations.slice(0, 15)
            )
        );

        renderConversationList();
    }

    function renderConversationList() {
        const conversations =
            getStoredConversations();

        if (conversations.length === 0) {
            conversationList.innerHTML = `
                <div
                    style="
                        padding: 12px;
                        color: var(--sidebar-muted);
                        font-size: 12px;
                        line-height: 1.5;
                    "
                >
                    Your recent conversations will appear here.
                </div>
            `;

            return;
        }

        conversationList.innerHTML =
            conversations
                .map(
                    conversation => `
                        <button
                            class="conversation-item"
                            type="button"
                            onclick="loadConversation(
                                '${conversation.id}'
                            )"
                        >
                            <span>◌</span>

                            <span>
                                ${escapeHtml(
                                    conversation.title
                                )}
                            </span>
                        </button>
                    `
                )
                .join("");
    }

    function loadConversation(id) {
        const conversations =
            getStoredConversations();

        const conversation =
            conversations.find(
                item => item.id === id
            );

        if (!conversation) {
            return;
        }

        currentConversationId =
            conversation.id;

        currentMessages =
            conversation.messages || [];

        chatContent.innerHTML = "";

        currentMessages.forEach(
            message => {
                appendMessage(
                    message.role === "assistant"
                        ? "bot"
                        : "user",
                    message.content
                );
            }
        );

        closeSidebar();
        scrollToBottom();
    }

    function getStoredConversations() {
        try {
            return JSON.parse(
                localStorage.getItem(
                    "enterprise_chat_history"
                ) || "[]"
            );
        } catch {
            return [];
        }
    }

    function createConversationId() {
        return (
            Date.now().toString() +
            "-" +
            Math.random()
                .toString(16)
                .slice(2)
        );
    }

    function saveToken() {
        const token =
            tokenInput.value.trim();

        if (!token) {
            showToast(
                "Enter a token before saving."
            );

            return;
        }

        localStorage.setItem(
            "enterprise_chat_token",
            token
        );

        showToast("JWT token saved.");
    }

    function loadToken() {
        tokenInput.value =
            localStorage.getItem(
                "enterprise_chat_token"
            ) || "";
    }

    function clearToken() {
        tokenInput.value = "";

        localStorage.removeItem(
            "enterprise_chat_token"
        );

        showToast("JWT token removed.");
    }

    async function checkApiStatus(
        showResult
    ) {
        setApiState(
            "checking",
            "Checking API"
        );

        try {
            const response = await fetch(
                API_HEALTH_URL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Health endpoint failed"
                );
            }

            setApiState(
                "online",
                "API online"
            );

            if (showResult) {
                showToast(
                    "FastAPI server is online."
                );
            }

        } catch {
            setApiState(
                "offline",
                "API offline"
            );

            if (showResult) {
                showToast(
                    "Could not connect to FastAPI."
                );
            }
        }
    }

    function setApiState(
        state,
        text
    ) {
        sidebarStateDot.className =
            "state-dot";

        if (state === "online") {
            sidebarStateDot.classList.add(
                "online"
            );
        }

        if (state === "offline") {
            sidebarStateDot.classList.add(
                "offline"
            );
        }

        sidebarStateText.textContent = text;
    }

    function toggleTheme() {
        document.body.classList.toggle(
            "dark"
        );

        const theme =
            document.body.classList.contains(
                "dark"
            )
                ? "dark"
                : "light";

        localStorage.setItem(
            "enterprise_chat_theme",
            theme
        );
    }

    function loadTheme() {
        const savedTheme =
            localStorage.getItem(
                "enterprise_chat_theme"
            );

        const prefersDark =
            window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

        if (
            savedTheme === "dark" ||
            (!savedTheme && prefersDark)
        ) {
            document.body.classList.add(
                "dark"
            );
        }
    }

    function toggleSidebar() {
        sidebar.classList.toggle("open");
        sidebarOverlay.classList.toggle(
            "show"
        );
    }

    function closeSidebar() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove(
            "show"
        );
    }

    function showToast(message) {
        const toast =
            document.getElementById("toast");

        toast.textContent = message;
        toast.classList.add("show");

        window.clearTimeout(
            showToast.timeoutId
        );

        showToast.timeoutId =
            window.setTimeout(
                function () {
                    toast.classList.remove(
                        "show"
                    );
                },
                2400
            );
    }

    function formatTime(date) {
        return date.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>

</body>
</html>
